<!DOCTYPE html>
<html>
<head>
    <title>Applicant Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: url("/static/bg.jpg") no-repeat center center/cover;
            min-height: 100vh;
        }

        .overlay {
            min-height: 100vh;
            width: 100%;
            background: rgba(0,0,0,0.65);
            padding-bottom: 40px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            color: white;
        }

        .navbar h2 {
            font-weight: 600;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #4da3ff;
        }

        /* Form Card */
        .form-container {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }

        h3 {
            text-align: center;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #4da3ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b6fdc;
        }

        .footer {
            text-align: center;
            color: #bbb;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <!-- Navbar -->
    <div class="navbar">
        <h2>CreditAI</h2>

        <div class="nav-links">
            <a href="/home/">Dashboard</a>
            <a href="/train/">Train Models</a>
            <a href="/about/">About</a>
            <a href="/logout/">Logout</a>
        </div>
    </div>

    <!-- Form Section -->
    <div class="form-container">
        <h3>Enter Applicant Financial Details</h3>

        <form method="POST" action="/predict/">
        {% csrf_token %}

        <div class="grid">

            <div>
                <label>Age</label>
                <input type="number" name="Age" required>
            </div>

            <div>
                <label>Income</label>
                <input type="number" name="Income" required>
            </div>

            <div>
                <label>Employment Type</label>
                <select name="Employment_Type">
                    <option>Salaried</option>
                    <option>Self-Employed</option>
                    <option>Business</option>
                </select>
            </div>

            <div>
                <label>Years Employed</label>
                <input type="number" name="Years_Employed">
            </div>

            <div>
                <label>Loan Amount</label>
                <input type="number" name="Loan_Amount">
            </div>

            <div>
                <label>Loan Term</label>
                <select name="Loan_Term">
                    <option>12</option>
                    <option>24</option>
                    <option>36</option>
                    <option>60</option>
                    <option>120</option>
                    <option>180</option>
                </select>
            </div>

            <div>
                <label>Credit History</label>
                <select name="Credit_History">
                    <option>Good</option>
                    <option>Average</option>
                    <option>Bad</option>
                </select>
            </div>

            <div>
                <label>Existing Debt</label>
                <input type="number" name="Existing_Debt">
            </div>

            <div>
                <label>Debt-to-Income Ratio</label>
                <input type="text" name="Debt_to_Income">
            </div>

            <div>
                <label>Previous Default</label>
                <select name="Previous_Default">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Savings</label>
                <input type="number" name="Savings">
            </div>

            <div>
                <label>Dependents</label>
                <input type="number" name="Dependents">
            </div>

            <div>
                <label>Property Owned</label>
                <select name="Property_Owned">
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Loan Purpose</label>
                <select name="Loan_Purpose">
                    <option>Home</option>
                    <option>Car</option>
                    <option>Business</option>
                    <option>Education</option>
                    <option>Personal</option>
                </select>
            </div>

        </div>

        <div class="btn-container">
            <button type="submit">Predict Risk</button>
        </div>

        </form>
    </div>

    <div class="footer">
        © 2026 CreditAI • Prediction Interface
    </div>

</div>

</body>
</html>
