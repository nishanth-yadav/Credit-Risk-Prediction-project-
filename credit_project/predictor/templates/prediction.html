<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: url("/static/bg.jpg") no-repeat center center/cover;
            min-height: 100vh;
        }

        .overlay {
            min-height: 100vh;
            width: 100%;
            background: rgba(0,0,0,0.65);
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            color: white;
        }

        .navbar h2 {
            font-weight: 600;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #4da3ff;
        }

        /* Result Card */
        .result-card {
            width: 450px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }

        .result-card h3 {
            margin-bottom: 20px;
        }

        .risk {
            font-size: 22px;
            margin: 10px 0;
        }

        .confidence {
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 4px;
            background-color: #4da3ff;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #1b6fdc;
        }

        .error {
            color: red;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <!-- Navbar -->
    <div class="navbar">
        <h2>CreditAI</h2>

        <div class="nav-links">
            <a href="/home/">Dashboard</a>
            <a href="/input/">Prediction</a>
            <a href="/train/">Train Models</a>
            <a href="/about/">About</a>
            <a href="/logout/">Logout</a>
        </div>
    </div>

    <!-- Result Section -->
    <div class="result-card">

        <h3>Prediction Result</h3>

        {% if error %}
            <p class="error">{{error}}</p>
        {% else %}
            <p class="risk"><b>Risk Level:</b> {{prediction}}</p>
            <p class="confidence"><b>Confidence Score:</b> {{probability}}%</p>

            <a href="/explanation/">
                <button class="btn">View AI Explanation</button>
            </a>
        {% endif %}

    </div>

    <div class="footer">
        © 2026 CreditAI • Risk Evaluation Result
    </div>

</div>

</body>
</html>
